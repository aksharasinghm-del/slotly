# Optional alternative to Vercel: Render's free plan (https://render.com/deploy).
# Free Render apps sleep after 15 minutes idle (first visit then takes ~1 minute),
# and their disk is wiped on restart, so data lives in a free Turso database.
services:
  - type: web
    name: slotly
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
